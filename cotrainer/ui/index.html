<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-Trainer</title>
<style>
:root{--bg:#0f1216;--panel:#161a20;--panel2:#1c2129;--line:#232a33;--line2:#2e3742;--text:#e6e8eb;--muted:#8b96a3;--dim:#64707d;
 --acc:#4fd1a5;--ink:#0f1216;--good:#4fd18b;--warn:#f0a020;--bad:#ef5b5b;--blue:#5fb0ff;--r:10px;
 --warn-line:#f0a020;--warn-bg:#2a1f12;--warn-text:#f5c27a;--top-bg:rgba(15,18,22,.94);--v1:#6b777c;--v2:#c9d3d6;--v3:#8fe07a;--v4:#ffd34d;
 --acc-soft:rgba(79,209,165,.12);--acc-line:rgba(79,209,165,.4)}
html[data-theme="light"]{--bg:#f5f6f8;--panel:#ffffff;--panel2:#f0f2f5;--line:#e3e6ea;--line2:#cfd5dc;--text:#1c2128;--muted:#5b6673;--dim:#7d8792;
 --acc:#0e7a45;--ink:#ffffff;--good:#0e7a45;--warn:#b86e00;--bad:#c62828;--blue:#1565c0;
 --warn-bg:#fff4e5;--warn-text:#8a4b00;--top-bg:rgba(245,246,248,.94);--v1:#8a949c;--v2:#3b4651;--v3:#0e7a45;--v4:#b86e00;
 --acc-soft:rgba(14,122,69,.08);--acc-line:rgba(14,122,69,.45)}
*{box-sizing:border-box}
[hidden]{display:none!important}
input[type=range],input[type=checkbox]{accent-color:var(--acc)}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
h1,h2,h3{margin:0;font-weight:700}
h2{font-size:19px;margin-bottom:12px}
h3{font-size:12px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.top{position:sticky;top:0;z-index:20;background:var(--top-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1360px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.logo{width:30px;height:30px;border-radius:8px;background:var(--acc);color:var(--ink);display:grid;place-items:center;font-size:13px}
.chip{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.chip b{color:var(--text)}
.shell{max-width:1500px;margin:auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;padding:22px 20px 80px;align-items:start}
.side{position:sticky;top:70px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.side label{display:flex;gap:8px;align-items:center;padding:5px 0;cursor:pointer}
.side input{accent-color:var(--acc);width:16px;height:16px;padding:0}
.side hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.lnk{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 0;font:inherit;color:var(--muted);cursor:pointer}
.lnk:hover{color:var(--acc)}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static}}
main section{margin-bottom:34px;scroll-margin-top:70px}
.sech{font-size:22px;margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
a{color:var(--acc);cursor:pointer}
/* Geführter Start */
#wizard{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:8vh 20px 40px}
.wzh{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;margin-bottom:22px}
.wzc{width:min(680px,100%);padding:26px}
.wzc h2{font-size:21px;margin-bottom:16px}
.stepn{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);font-weight:700;margin-bottom:6px}
.wzf{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}
.msg{font-size:13px;margin:10px 0 0;color:var(--muted)}.msg.ok{color:var(--good)}.msg.err{color:var(--bad)}
.pick{border:1px solid var(--line2);border-radius:8px;padding:11px 13px;margin:6px 0;background:var(--panel2);cursor:pointer}
.pick:hover{border-color:var(--muted)}
.pick.sel{border-color:var(--acc);background:var(--acc-soft)}
.pick b{display:block}
.picklist{max-height:260px;overflow-y:auto;margin-top:12px;padding-right:4px}
.grid6{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid6 .pick{margin:0}
.warnbox{border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-text);border-radius:8px;padding:10px 13px;margin-top:14px;font-size:13px}
.warnbox .btn{margin-top:8px}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:18px 0 10px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .4s}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-an{display:grid;grid-template-columns:minmax(320px,460px) 1fr;gap:18px}
@media(max-width:950px){.grid2,.grid-an{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:18px}
.kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
@media(max-width:900px){.kpi{grid-template-columns:1fr 1fr}}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-size:21px}
.muted{color:var(--muted)}.dim{color:var(--dim)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.pill{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:600;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.g{background:rgba(79,209,139,.12);border-color:rgba(79,209,139,.35);color:var(--good)}
.pill.w{background:rgba(242,163,58,.12);border-color:rgba(242,163,58,.35);color:var(--warn)}
.pill.b{background:rgba(239,91,91,.12);border-color:rgba(239,91,91,.35);color:var(--bad)}
.pill.a{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc)}
select,input{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:13px;color:var(--text)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--ink)}
/* Spielfeld */
.pitch{position:relative;width:100%;aspect-ratio:7/9;border-radius:10px;overflow:hidden;border:1px solid #2c5a3d;background:repeating-linear-gradient(180deg,#163b26 0 10%,#184029 10% 20%)}
.pitch .ln{position:absolute;border:1.5px solid rgba(255,255,255,.16)}
.slot{position:absolute;transform:translate(-50%,-50%);width:124px;text-align:center;cursor:pointer;color:#e6e8eb}
.slot .dot{width:44px;height:44px;margin:0 auto 3px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:#0f1a14;border:2.5px solid var(--muted)}
.slot .nm{font-size:11px;font-weight:600;background:rgba(0,0,0,.65);border-radius:4px;padding:1px 6px;display:inline-block;max-width:124px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .rl{font-size:10px;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.sel .dot{box-shadow:0 0 0 3px var(--acc)}
.n-good .dot{border-color:#4fd18b;color:#4fd18b}.n-ok .dot{border-color:#d7e3e6}.n-warn .dot{border-color:#f0a020;color:#f0a020}.n-bad .dot{border-color:#ef5b5b;color:#ef5b5b}
@media(max-width:600px){.slot{width:80px}.slot .rl{display:none}.slot .dot{width:34px;height:34px;font-size:11px}}
/* Tabellen */
.tblw{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);font-weight:600;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--panel2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pname{font-weight:600}.psub{font-size:12px;color:var(--muted)}
.fit{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--line) 0)}
.fit span{width:34px;height:34px;border-radius:50%;background:var(--panel);display:grid;place-items:center}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;width:80px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%}
.need{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin-bottom:8px}
.need .tag{font-weight:800;text-align:center;border-radius:6px;padding:4px 0;font-size:14px}
ul.tips{margin:6px 0 0;padding-left:18px}ul.tips li{margin-bottom:6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media(max-width:900px){.week{grid-template-columns:1fr 1fr}}
.day{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.day b{display:block;margin-bottom:6px}
.sess{font-size:12px;padding:5px 7px;border-radius:6px;margin-bottom:5px;border-left:3px solid var(--dim);background:var(--panel)}
.sess small{display:block;color:var(--muted);font-size:10.5px}
.c-tak{border-color:var(--blue)}.c-tec{border-color:var(--acc)}.c-phy{border-color:var(--warn)}.c-rec{border-color:var(--good)}.c-match{border-color:var(--bad)}.c-set{border-color:#c48cff}
.attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.attrs .a{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0;border-bottom:1px dashed var(--line)}
.attrs .a.k{font-weight:700}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:transform .2s;overflow-y:auto;padding:22px}
body.dr #drawer{transform:none}body.dr #scrim{display:block}
.v1{color:var(--v1)}.v2{color:var(--v2)}.v3{color:var(--v3)}.v4{color:var(--v4)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{font-size:12px;color:var(--dim);margin-top:10px}
.seg{display:inline-flex;gap:0}.seg .btn{border-radius:0;margin-left:-1px}.seg .btn:first-child{border-radius:8px 0 0 8px;margin-left:0}.seg .btn:last-child{border-radius:0 8px 8px 0}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}
.mdc{width:min(520px,100%);padding:24px}
</style>
</head>

function load(){let s={};try{s=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){}

 const tStyle=DATA&&DATA.tactic&&DATA.tactic.style;

 s.style=s.style||tStyle||'vertical_tikitaka';

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=new Intl.NumberFormat('de-DE');
function yr(w){return w==null?null:w*52;}  // Gehälter liegen pro Woche vor, angezeigt wird pro Jahr wie im Spiel
function money(v){if(v==null)return'–';const a=Math.abs(v);return a>=1e6?(v/1e6).toLocaleString('de-DE',{maximumFractionDigits:2})+' Mio. €':a>=1e3?Math.round(v/1e3)+'K €':nf.format(v)+' €';}
const posRating=(p,pos)=>p.pos[PK.indexOf(pos)]||1;

function styleMods(posList){const w={},st=STYLES[S.style];if(!st)return w;
 const mods=[...st.mods];if(S.useInstr!==false&&S.formation===TCFG.name)instrList().forEach(([,k,v])=>{const x=INSTR[k+':'+v];if(x)mods.push(...x.m);});
 for(const[g,attrs,x]of mods){if(!PG[g].some(p=>posList.includes(p)))continue;attrs.split(' ').forEach(a=>w[a]=(w[a]||0)+x);}return w;}
const WCACHE=new Map();
function weights(rid,posList){const k=rid+'|'+posList+'|'+S.style+'|'+S.formation+'|'+S.useInstr;if(WCACHE.has(k))return WCACHE.get(k);const r=ROLES[rid],w={};
 r.key.forEach(a=>w[a]=(w[a]||0)+3);r.pref.forEach(a=>w[a]=(w[a]||0)+1.5);
 const m=styleMods(posList);for(const a in m)w[a]=(w[a]||0)+Math.min(2,m[a]);
 if(!posList.includes('GK'))['Acc','Pac'].forEach(a=>w[a]=(w[a]||0)+.75);
 const out=Object.entries(w);WCACHE.set(k,out);return out;}
function roleScore(p,rid,pos){let s=0,t=0;for(const[a,w]of weights(rid,[pos])){const v=p.a[a];if(v==null)continue;s+=v*w;t+=w;}return t?s/t*5:0;}
function posFactor(p,pos){const r=posRating(p,pos);if(r>=18)return 1;if(r>=15)return .96;if(r>=12)return .9;
 if(S.related!==false&&(RELATED[pos]||[]).some(x=>posRating(p,x)>=15))return .86;return r>=9?.8:.62;}
function slotScore(p,sl){if(sl.pos==='GK'&&posRating(p,'GK')<10)return 0;if(sl.pos!=='GK'&&posRating(p,'GK')>=15&&Math.max(...p.pos.filter((_,i)=>i))<10)return 0;
 const ip=roleScore(p,sl.ip,sl.pos),oop=roleScore(p,sl.oop,sl.pos),w=S.ipw/100;return (ip*w+oop*(1-w))*posFactor(p,sl.pos);}
function slots(){const f=FORMATIONS[S.formation]||FORMATIONS['4-1-1-3-1 DM Breit'];const rs=S.roles[S.formation]||[];
 return f.map((s,i)=>({i,pos:s[0],x:s[1],y:s[2],ip:(rs[i]&&rs[i][0])||s[3],oop:(rs[i]&&rs[i][1])||s[4],op:s[7]||s[0]}));}
let AN_MEMO=null,AN_HOLD=false;   /* während eines render()-Durchlaufs nur einmal rechnen */
function analyze(){if(AN_HOLD){if(!AN_MEMO)AN_MEMO=analyzeNow();return AN_MEMO;}return analyzeNow();}
function analyzeNow(){const sl=slots(),sq=DATA.squad,used=new Set(),assign=new Array(sl.length).fill(null);
 const pairs=[];sl.forEach((s,i)=>sq.forEach(p=>{const sc=slotScore(p,s);if(sc>0)pairs.push([sc,i,p]);}));
 pairs.sort((a,b)=>b[0]-a[0]);for(const[sc,i,p]of pairs){if(assign[i]||used.has(p.id))continue;assign[i]={p,sc};used.add(p.id);}
 const depth=sl.map((s,i)=>sq.filter(p=>!assign[i]||p.id!==assign[i].p.id).map(p=>({p,sc:slotScore(p,s)})).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,3));
 const vals=assign.filter(Boolean).map(x=>x.sc);const avg=vals.reduce((a,b)=>a+b,0)/Math.max(1,vals.length);
 return{sl,assign,depth,avg};}
function cls(sc,avg){if(sc==null)return'bad';return sc>=avg+4?'good':sc>=avg-3?'ok':sc>=avg-8?'warn':'bad';}
function colorFor(sc,avg){return{good:'var(--good)',ok:'#d7e3e6',warn:'var(--warn)',bad:'var(--bad)'}[cls(sc,avg)];}

function pitch(an,click){const ln='<div class="ln" style="left:0;right:0;top:50%;border-width:1.5px 0 0"></div><div class="ln" style="left:50%;top:50%;width:26%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)"></div><div class="ln" style="left:22%;right:22%;bottom:-2px;height:16%"></div><div class="ln" style="left:22%;right:22%;top:-2px;height:16%"></div>';
 return`<div class="pitch">${ln}${an.sl.map((s,i)=>{const a=an.assign[i];const sc=a?a.sc:null;
  return`<div class="slot n-${cls(sc,an.avg)} ${S.selSlot===i?'sel':''}" style="left:${s.x}%;top:${s.y}%" ${click?`onclick="selSlot(${i})"`:''}><div class="dot">${sc?Math.round(sc):'–'}</div>
  <div class="nm">${a?esc(a.p.n):'<i>unbesetzt</i>'}</div><div class="rl">${PDE[s.pos]} · ${roleLabel(s,'ip')}</div><div class="rl">gegen Ball: ${s.op!==s.pos?PDE[s.op]+' · ':''}${roleLabel(s,'oop')}</div></div>`;}).join('')}</div>`;}
function roleLabel(s,ph){const r=ROLES[s[ph]].name;const ab=S.formation===TCFG.name&&ABBR[s.i]&&s[ph]===TCFG.slots[s.i][ph==='ip'?3:4]?ABBR[s.i][ph==='ip'?0:1]:'';return esc(ab?ab+' – '+r:r);}
function selSlot(i){S.selSlot=S.selSlot===i?null:i;save();render();}

function needs(an){const out=[];an.sl.forEach((s,i)=>{const a=an.assign[i],d=an.depth[i];const sc=a?a.sc:0;const back=d[0]?d[0].sc:0;
  let lvl=null,why='';
  if(!a){lvl='b';why='Kein passender Spieler im Kader';}
  else if(sc<an.avg-8){lvl='b';why=`Stammspieler deutlich unter Teamniveau (${Math.round(sc)} vs. Ø ${Math.round(an.avg)})`;}
  else if(sc<an.avg-3){lvl='w';why=`Stammspieler leicht unter Teamniveau (${Math.round(sc)} vs. Ø ${Math.round(an.avg)})`;}
  else if(back<an.avg-12){lvl='w';why=`Kein gleichwertiger Ersatz (bester Backup: ${d[0]?esc(d[0].p.n)+' '+Math.round(back):'keiner'})`;}
  if(lvl)out.push({i,s,lvl,why,sc});});
 return out.sort((a,b)=>(a.lvl==='b'?0:1)-(b.lvl==='b'?0:1)||a.sc-b.sc);}

function teamAttr(an,keys){const ps=an.assign.filter(Boolean).map(x=>x.p).filter(p=>posRating(p,'GK')<10);
 return keys.map(k=>[k,ps.reduce((s,p)=>s+(p.a[k]||0),0)/Math.max(1,ps.length)]);}

/* Mischung über Ligen: jeder weitere Spieler derselben Liga (Staffeln zusammengefasst, vereinslos und ohne Liga
   je eine Gruppe) zählt MIX_PEN Punkte weniger. Nur sichtbare Merkmale. rows nach rec absteigend sortiert. */
const MIX_PEN=4;
const lgGroup=p=>!p.club?'vereinslos':p.lg?p.lg.replace(/\/.*$/,''):'ohne Liga';
function mixLeagues(rows,n){const left=rows.slice(),cnt={},out=[];
 while(out.length<n&&left.length){let bi=0,bv=-Infinity;
  for(let j=0;j<left.length;j++){const v=left[j].rec-MIX_PEN*(cnt[lgGroup(left[j].p)]||0);if(v>bv){bv=v;bi=j;}
   if(left[j].rec<=bv)break;}  /* sortiert: ab hier kann keiner mehr gewinnen */
  const x=left.splice(bi,1)[0];const g=lgGroup(x.p);cnt[g]=(cnt[g]||0)+1;out.push(x);}
 return out;}

 const weak=sl[order[0]],weak3=new Set(order.slice(0,3).map(i=>sl[i].pos));
 const idx=S.f.pos===''?sl.map((_,i)=>i):[+S.f.pos];const rows=[];
 for(const p of DATA.pool){if(!p.vis||!showOut(p))continue;if(p.age>S.f.age||(p.will??0)<S.f.will)continue;if(S.f.free&&!freeOrEnding(p))continue;
  if(!idx.some(i=>posRating(p,sl[i].pos)>=15))continue;
  const plW=posRating(p,weak.pos)>=15,pl3=[...weak3].some(x=>posRating(p,x)>=15),free=!p.club,left=daysLeft(p),ending=!free&&left!=null&&left<=365;
  const rec=(plW?40:pl3?15:0)+(free?8:0)+(p.near_league?10:0)+(ending?15:0)+0.3*(p.will||0)+(p.age<=21?5:0);
  const why=[];if(plW)why.push(`Spielt ${PDE[weak.pos]} – dort ist deine schwächste Position`);if(p.near_league)why.push('Spielt in einer Liga deines Niveaus');if(free)why.push('Vereinslos – ablösefrei');
  if(ending)why.push(`Vertrag läuft ${mmyyyy(p.end)} aus`);if(p.weaker_league)why.push('Kommt aus einer schwächeren Liga – Wechsel wahrscheinlich');
  if(p.age<=21)why.push(`Jung (${p.age}) – Platz zum Entwickeln`);
  rows.push({p,rec,why:why.slice(0,2),i:idx.find(i=>posRating(p,sl[i].pos)>=15)});}
 const endT=p=>!p.club?-Infinity:p.end?new Date(p.end).getTime():Infinity;
 const sorters={rec:(a,b)=>b.rec-a.rec,will:(a,b)=>(b.p.will||0)-(a.p.will||0)||b.rec-a.rec,young:(a,b)=>a.p.age-b.p.age||b.rec-a.rec,end:(a,b)=>endT(a.p)-endT(b.p)||b.rec-a.rec};
 rows.sort(sorters[sortKey()]);const top=sortKey()==='rec'?mixLeagues(rows,80):rows.slice(0,80);
 if(!top.length){el.innerHTML=`<div class="muted" style="padding:30px;text-align:center">${DATA.meta.scout_area===1?`In deinem Scoutinggebiet (Kein Scouting) gibt es gerade keine passenden vertragslosen Spieler aus ${esc(DATA.meta.nat_name||'deinem Land')}.`:'Keine passenden Kandidaten – Filter lockern (Position, Alter, Wechselchance).'}</div>`;return;}
 el.innerHTML=`<div class="tblw"><table class="tbl"><thead><tr><th>Spieler</th><th>Positionen</th><th>Verein · Liga</th><th>Vertrag bis</th><th class="num">Wechselchance</th><th>Grund</th></tr></thead><tbody>
 ${top.map(x=>{const p=x.p;
  return`<tr class="click" onclick="openPlayer(${p.id},${x.i})"><td><div class="pname">${esc(p.n)}</div><div class="psub">${p.age} J. · ${esc(p.nat||'–')}</div></td>
  <td>${posNames(p)||'–'}</td><td>${esc(p.club||'vereinslos')}${outPill(p)}${p.lg?'<div class="psub">'+esc(p.lg)+'</div>':''}</td>
  <td class="psub">${p.end?new Date(p.end).toLocaleDateString('de-DE'):'–'}</td><td class="num"><b>${p.will??'–'} %</b></td>
  <td class="psub" style="max-width:300px">${x.why.map(esc).join('<br>')||'–'}</td></tr>`;}).join('')}</tbody></table></div>
 <p class="note">${rows.length} Spieler passen zu den Positionen deiner Startelf, angezeigt werden die ersten 80. Reihenfolge nur nach dem, was du im Spiel ohne Scouting siehst: Position, Vertrag, Wechselchance, Alter${sortKey()==='rec'?', gemischt über die Ligen':''}.</p>`;}

function vTraining(){const an=analyze(),st=STYLES[S.style];
 const ta=Object.fromEntries(teamAttr(an,['Pas','Fir','Tec','Dec','Vis','OtB','Fin','Dri','Tck','Pos','Mar','Wor','Sta','Nat','Acc','Agg','Ant']));
 const grp={'Ballbesitzarbeit':['Pas','Fir','Tec'],'Angriffsspiel mit Ball':['OtB','Fin','Dri'],'Defensivarbeit mit Ball':['Tck','Mar','Pos']};
 const fe=Object.entries(grp).map(([k,a])=>[k,a.reduce((s,x)=>s+ta[x],0)/a.length]).sort((a,b)=>a[1]-b[1]);
 const lowFit=(ta.Nat+ta.Sta)/2<11.5;
 const fb=(TCFG.feedback||[]);
 const tvIP=st.family==='possession'?['Passstil','Spielaufbau','Formation mit Ball','Chancen kreieren']:st.family==='counter'?['Ballvortrag','Formation mit Ball','Chancen kreieren','Spielaufbau']:['Formation mit Ball','Chancen kreieren','Passstil','Spielaufbau'];
 const pressing=/Hoch/.test((TCFG.instructions_oop||{}).Pressinglinie||'')||st.family==='pressing'||S.style==='vertical_tikitaka';
 const tvOOP=pressing?['Pressinglinie','Pressingintensität','Formation ohne Ball','Pressingfalle']:['Formation ohne Ball','Defensivblock','Defensive Positionierung','Pressinglinie'];
 const order=(arr)=>[...arr].sort((a,b)=>(fb.includes(b)?1:0)-(fb.includes(a)?1:0));
 const ip=order(tvIP),oop=order(tvOOP);
 const week=[
  ['Mo · Tag nach dem Spiel',['Erholung','Individuelle Entwicklung','Pause']],
  ['Di',[lowFit?'Kondition':'Leichtes Konditionstraining',ip[0],ip[1]]],
  ['Mi',[fe[0][0],oop[0],oop[1]]],
  ['Do',[fe[1][0],ip[2],oop[2]]],
  ['Fr · Spieltag –1',['Geheimtraining',ip[3]==='Chancen kreieren'?'Letztes Drittel':ip[3],'Ecken']],
  ['Sa',['Spiel','Pause','Pause']],
  ['So',['Erholung','Teamgeist','Pause']]];
 const ratings=DATA.squad.filter(p=>p.tr&&p.tr[1]).sort((a,b)=>b.tr[1]-a.tr[1]);
 const avgR=ratings.reduce((s,p)=>s+p.tr[1],0)/Math.max(1,ratings.length);
 const sess=k=>`<div class="sess ${CAT[SESS[k]||'x'][1]}">${esc(k)}${fb.includes(k)?' <span class="pill w">Feedback</span>':''}<small>${esc(SESS_INFO[k]||'')}${CAT[SESS[k]]&&CAT[SESS[k]][0]?' · '+CAT[SESS[k]][0]:''}</small></div>`;
 return`<div class="card" style="margin-bottom:18px"><h2>Empfohlene Trainingswoche für „${esc(st.name)}“</h2>
 <p class="muted" style="margin-top:-6px">Spieltag Samstag, je Tag E1–E3. Taktischer Schwerpunkt mit Ball: ${ip.slice(0,3).join(', ')} · gegen den Ball: ${oop.slice(0,3).join(', ')}.
 ${fb.length?` Taktik-Feedback aus dem Spiel („mehr Zeit in ${fb.join(' / ')} investieren“) ist vorgezogen.`:''}
 Fußballerische Entwicklung: <b>${fe[0][0]}</b> (Ø ${fe[0][1].toFixed(1)}) und <b>${fe[1][0]}</b> (Ø ${fe[1][1].toFixed(1)}) – die schwächsten Bereiche deiner Startelf.${lowFit?' Fitness (Grundfitness/Ausdauer) ist niedrig → „Kondition“ statt „Leichtes Konditionstraining“.':''}</p>
 <div class="week">${week.map(([d,ss])=>`<div class="day"><b>${d}</b>${ss.map((k,i)=>`<div class="psub" style="font-size:10px;margin-top:${i?4:0}px">E${i+1}</div>${sess(k)}`).join('')}</div>`).join('')}</div>
 <ul class="tips" style="margin-top:12px"><li><b>Zwei Spiele pro Woche:</b> Di = Erholung · Individuelle Entwicklung · Pause, Mi = Geheimtraining · ${esc(ip[0])} · Pause, Do = Spiel.</li>
 <li><b>Vor schweren Gegnern:</b> Fr E2 auf „Defensivblock“ oder „Defensive Positionierung“ wechseln.</li>
 <li><b>Intensität:</b> ${lowFit?'Normal – Fitness ist knapp, bei Gegenpressing steigt die Ermüdung.':'Normal bis hoch – die Fitness der Startelf trägt das Pressing.'}</li></ul></div>
 <div class="grid2"><div class="card"><h2>Trainingsbewertungen</h2>${ratings.length?`<table class="tbl"><thead><tr><th>Spieler</th><th class="num">Vorher</th><th class="num">Aktuell</th><th></th></tr></thead><tbody>
 ${ratings.map(p=>{const t=p.tr;const c=t[1]>=7.25?'good':t[1]>=6.75?'':t[1]>=6.25?'warn':'bad';return`<tr class="click" onclick="openPlayer(${p.id})"><td class="pname">${esc(p.n)}</td><td class="num muted">${t[0]?t[0].toFixed(2):'–'}</td><td class="num"><b class="${c}">${t[1].toFixed(2)}</b></td><td>${t[0]&&t[1]>t[0]+.1?'<span class="good">▲</span>':t[0]&&t[1]<t[0]-.1?'<span class="bad">▼</span>':''}</td></tr>`;}).join('')}</tbody></table>
 <p class="note">Ø Team ${avgR.toFixed(2)}. Spieler unter 6,5 → Gespräch führen oder Intensität/Fokus prüfen.</p>`:'<p class="muted">Noch keine Trainingsbewertungen im Spielstand (z. B. kurz nach Spielbeginn).</p>'}</div>
 <div class="card"><h2>Gespeicherte Wochenpläne</h2>${(DATA.training.weeks||[]).length?(DATA.training.weeks||[]).map((w,i)=>`<h3 style="margin-top:${i?14:0}px">Plan ${i+1}</h3><table class="tbl"><tbody>${w.map(([d,n])=>`<tr><td class="psub">${new Date(d).toLocaleDateString('de-DE')}</td><td>${esc(n)}</td></tr>`).join('')}</tbody></table>`).join(''):'<p class="muted">Keine gespeicherten Wochenpläne gefunden.</p>'}</div></div>`;}

function setTheme(t){document.documentElement.dataset.theme=t==='light'?'light':'dark';}
function toggleTheme(){const t=document.documentElement.dataset.theme==='light'?'dark':'light';setTheme(t);API.set_theme(t);}
function show(v){W.view=v;const app=v==='app';document.getElementById('app').hidden=!app;document.getElementById('wizard').hidden=app;if(!app){drawWizard();window.scrollTo(0,0);}}

/* Schritt 1: Spielstand-Ordner */
async function openDir(){W.dirMsg='';W.dirOk=false;await refresh();W.dirVal=W.state.saves_dir||W.state.suggested_dir||'';show('s1');if(W.dirVal)checkDir(W.dirVal);}
async function checkDir(p){W.dirVal=p;W.dirOk=false;const r=await API.set_saves_dir(p);if(W.dirVal!==p)return;W.dirOk=!!r.ok;
 W.dirMsg=r.ok?`✓ Ordner gefunden – ${nSaves(r.count)} (Sicherungen ausgeblendet)`:r.error;if(W.view==='s1')drawWizard();}
async function browseDir(){const r=await API.browse_saves_dir();if(r&&r.path)checkDir(r.path);}
async function dirNext(){const v=document.getElementById('dir').value.trim();await checkDir(v);if(!W.dirOk)return;await refresh();openSaves(false);}

/* Schritt 2: Spielstand */
function openSaves(list){W.list=!!list;W.error='';W.gameMsg='';show('s2');pickSave(0);}
async function switchSave(){await refresh();if(!W.state.saves_dir)return openDir();openSaves(true);}
async function pickSave(i){const s=W.state.saves[i];if(!s){W.sel=null;W.sum=null;return;}
 W.sel=s.path;W.sum=null;if(W.view==='s2')drawWizard();
 const r=await API.summary(s.path);if(W.sel!==s.path)return;W.sum=r;if(W.view==='s2')drawWizard();}
async function pickGameDir(){const r=await API.browse_game_dir();if(!r||!r.path)return;const x=await API.set_game_dir(r.path);
 if(x.ok){await refresh();W.gameMsg='';}else W.gameMsg=x.error;if(W.view==='s2')drawWizard();}

/* Einlesen */
/* W.sel = Auswahl in Schritt 2, W.run = gerade eingelesener, W.cur = angezeigter Spielstand */
async function runAnalyse(keep,path){const p=path||W.sel;if(W.busy||!p)return;W.busy=true;W.run=p;W.keep=!!keep;W.error='';W.prog=[0,6,'Spielstand wird geöffnet …'];show('load');
 let r;try{r=await API.analyse(p);}catch(e){r={started:false,error:'Das Einlesen konnte nicht gestartet werden.'};}
 if(!r.started){W.busy=false;W.error=r.error;drawWizard();}}
function reread(){runAnalyse(true,W.cur);}
const CT={
 onProgress(i,n,text){W.prog=[i,n,text];if(W.view==='load')drawWizard();},
 onResult(data){W.busy=false;
  try{start(data,W.keep?null:W.pick);W.cur=W.run;}
  catch(e){console.error(e);W.error='Das Ergebnis konnte nicht angezeigt werden ('+(e&&e.name||'Fehler')+').';show('load');}},
 onError(text){W.busy=false;W.error=text;show('load');}
};
window.CT=CT;

   <p class="note">${nSaves(saves.length)}, neueste zuerst. Sicherungen des Spiels sind ausgeblendet.</p>`:''}
  ${st.lang_db_found===false?`<div class="warnbox">Ligen- und Rollennamen fehlen, weil die Spielinstallation nicht gefunden wurde. Das Einlesen funktioniert trotzdem.
   ${W.gameMsg?`<div class="msg err">${esc(W.gameMsg)}</div>`:''}<div><button class="btn" onclick="pickGameDir()">Spielordner wählen…</button></div></div>`:''}
  <div class="wzf">${back}<button class="lnk" style="width:auto" onclick="openDir()">Ordner ändern…</button></div>`;}
 else if(W.view==='s3')h=`<div class="stepn">Schritt 3 von 3</div><h2>Welche Analyse möchtest du sehen?</h2>
  <div class="grid6">${PICKS.map(([k,l,d])=>`<div class="pick ${W.pick===k?'sel':''}" onclick="W.pick='${k}';drawWizard()"><b>${l}</b><div class="muted">${d}</div></div>`).join('')}</div>
  <p class="note">Das ist nur der Startzustand – im Ergebnis lässt sich jeder Bereich jederzeit ein- und ausblenden.</p>
  <div class="wzf"><button class="btn" onclick="show('s2')">Zurück</button><button class="btn pri" onclick="runAnalyse(false)">Analyse starten</button></div>`;
 else if(W.view==='load')h=W.error?`<h2>Der Spielstand konnte nicht eingelesen werden</h2><div class="warnbox" style="margin-top:0">${esc(W.error)}</div>
  <div class="wzf"><button class="btn" onclick="switchSave()">Anderen Spielstand wählen…</button><button class="btn pri" onclick="runAnalyse(W.keep,W.run)">Nochmal versuchen</button></div>`
  :`<h2>Spielstand wird eingelesen</h2><div class="prog"><i style="width:${Math.round(W.prog[0]/Math.max(1,W.prog[1])*100)}%"></i></div>
  <p class="muted">${esc(W.prog[2])}</p><p class="note">Das dauert je nach Spielstand ein bis zwei Minuten. Der Spielstand wird nur gelesen.</p>`;
 el.innerHTML=`<div class="wzh"><div class="logo">CT</div>Co-Trainer</div><div class="card wzc">${h}</div>${st.version?`<p class="note">Version ${esc(st.version)}</p>`:''}`;}

/* Entwicklermodus (?dev=1 im Browser): Daten aus dev-data.json, Python wird nachgestellt */
async function devApi(){const d=await (await fetch('dev-data.json?v='+Date.now())).json();
 let theme='dark',info='aus',skip=false;try{theme=localStorage.getItem('cotrainer-dev-theme')||'dark';info=localStorage.getItem('cotrainer-dev-info')||'aus';skip=localStorage.getItem('cotrainer-dev-skip')==='1';}catch(e){}
 const dir='C:\\Entwicklung\\games',sv=[{path:'dev.fm',name:d.meta.save||'Entwicklerdaten.fm',saved:d.meta.created}];
 return{get_state:async()=>({saves_dir:dir,suggested_dir:dir,theme,info_level:info,skip_spoiler_warning:skip,version:'Entwicklermodus',saves:sv,lang_db_found:true}),
  set_info_level:async(l,s=null)=>{if(!['aus','scoutbericht','werte'].includes(l))return{ok:false,error:'Unbekannte Informationsstufe.'};
   info=l;if(s!==null)skip=!!s;try{localStorage.setItem('cotrainer-dev-info',l);localStorage.setItem('cotrainer-dev-skip',skip?'1':'0');}catch(e){}return{ok:true};},
  set_saves_dir:async p=>p?{ok:true,count:sv.length}:{ok:false,error:'Ordner nicht gefunden.'},
  browse_saves_dir:async()=>({path:null}),browse_game_dir:async()=>({path:null}),list_saves:async()=>({saves:sv}),
  summary:async()=>({ok:true,manager:d.meta.manager,club:d.meta.club_short,game_date:d.meta.date}),
  set_theme:async t=>{theme=t;try{localStorage.setItem('cotrainer-dev-theme',t);}catch(e){}return{ok:true};},
  set_game_dir:async()=>({ok:false,error:'Im Entwicklermodus nicht verfügbar.'}),
  analyse:async()=>{const n=6;for(let i=1;i<=n;i++)setTimeout(()=>CT.onProgress(i,n,'Schritt '+i+' von '+n+' (Entwicklerdaten) …'),i*100);
   setTimeout(()=>CT.onResult(d),n*100+120);return{started:true};}};}

async function boot(){if(BOOTED)return;BOOTED=true;
 const real=window.pywebview&&window.pywebview.api&&window.pywebview.api.get_state;
 try{
  if(!real&&DEV){API=await devApi();await refresh();show('s3');pickSave(0);return;}
  API=window.pywebview.api;await refresh();
  if(!W.state.saves_dir)return openDir();
  openSaves(false);
 }catch(e){W.error=DEV?'Entwicklerdaten fehlen: python -m cotrainer.extract --dump cotrainer/ui/dev-data.json':'Co-Trainer konnte nicht gestartet werden.';show('boot');}}
show('boot');
window.addEventListener('pywebviewready',boot,{once:true});
if(DEV)setTimeout(boot,400);
</script>
